# Printer config for the integration tests. Nothing here describes real
# hardware: the MCU is the firmware's linuxprocess simulation target and the
# pin names are that target's own, so the numbers are placeholders chosen only
# to pass config validation. The harness appends kalico_overlay.cfg to this
# file on a Kalico checkout.

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100

[stepper_x]
step_pin: gpio0
dir_pin: gpio1
enable_pin: !gpio2
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio3
position_endstop: 0
position_max: 400
homing_speed: 50

[stepper_y]
step_pin: gpio4
dir_pin: gpio5
enable_pin: !gpio6
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio7
position_endstop: 0
position_max: 400
homing_speed: 50

[stepper_z]
step_pin: gpio8
dir_pin: gpio9
enable_pin: !gpio10
microsteps: 16
rotation_distance: 8
endstop_pin: ^gpio11
position_endstop: 0
position_max: 300
homing_speed: 10

[extruder]
step_pin: gpio12
dir_pin: gpio13
enable_pin: !gpio14
microsteps: 16
rotation_distance: 22.6789511
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio15
sensor_type: Generic 3950
sensor_pin: analog0
control: watermark
min_temp: 0
max_temp: 300

[extruder1]
step_pin: gpio16
dir_pin: gpio17
enable_pin: !gpio18
microsteps: 16
rotation_distance: 22.6789511
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio19
sensor_type: Generic 3950
sensor_pin: analog1
control: watermark
min_temp: 0
max_temp: 300

# toolchange_gcode below renders to T0 or T1, so those commands have to exist
# the way they do on a toolchanger.
[gcode_macro T0]
gcode:
    ACTIVATE_EXTRUDER EXTRUDER=extruder

[gcode_macro T1]
gcode:
    ACTIVATE_EXTRUDER EXTRUDER=extruder1

[eddy_tool_calibration]
i2c_mcu: mcu
i2c_software_scl_pin: gpio20
i2c_software_sda_pin: gpio21
i2c_address: 42
# frequency is left out on purpose. Kalico's ldc1612 driver gained that
# option in March 2026, and an option no module read is a startup error, so
# setting it here would restrict this test to builds from then on.
reg_drive_current: 15
coil_x: 200.0
coil_y: 20.0
coil_z: 0.0
coil_inner_diameter: 2.0
scan_height: 1.0
scan_safe_z: 2.0
z_start: 2.5
z_stop: 0.5
z_step: 0.05
scan_angles: 45, 135
pair_scans: True
calibrate_z: True
switch_pin: ^gpio22
switch_x: 190.0
switch_y: 20.0
switch_probe_z_start: 3.0
calibration_temp: 150.0
tool_count: 2
toolchange_gcode:
    T{tool}
apply_offsets_gcode:
    SET_GCODE_OFFSET X={offset_x} Y={offset_y} Z={offset_z}
